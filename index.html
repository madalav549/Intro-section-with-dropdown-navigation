<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <title>Frontend Mentor | Intro section with dropdown navigation</title>
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alata&family=Barlow+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Barlow:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Epilogue:ital,wght@0,100..900;1,100..900&family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <img src="./images/logo.svg" class="logo" alt="snap company logo">
    <nav class="menu">
      <button class="close-menu-button">
        <img src="./images/icon-close-menu.svg" alt="menu close button">
      </button>
      <div class="left-header-section">
        <div class="features">
          <div class="features-header">
            <p>Features</p>
            <button class="open-dropdown">
              <img src="./images/icon-arrow-down.svg" alt="arrow-down button">
            </button>
            <button class="close-dropdown">
              <img src="./images/icon-arrow-up.svg" alt="arrow up button">
            </button>
          </div>
          <div class="features-dropdown dropdown">
          </div>
        </div>
        <div class="company">
          <div class="company-header">
            <p>Company</p>
            <button class="open-dropdown">
              <img src="./images/icon-arrow-down.svg" alt="arrow-down button">
            </button>
            <button class="close-dropdown">
              <img src="./images/icon-arrow-up.svg" alt="arrow up button">
            </button>
          </div>
          <div class="company-dropdown dropdown">
            <a href="#">History</a>
            <a href="#">Our Team</a>
            <a href="#">Blog</a>
          </div>
        </div>
        <div class="left-header-section-footer">
          <p>
            Careers
          </p>
          <p>
            About
          </p>
        </div>
      </div>

      <div class="right-header-section">
        <div class="buttons">
          <button class="login">Login</button>
          <button class="register">Register</button>
        </div>
      </div>
    </nav>
    <button class="menu-button">
      <img src="./images/icon-menu.svg" alt="menu-button">
    </button>
  </header>
  <main>
    <article class="hero-img-section">
      <img src="./images/image-hero-mobile.png" class="hero-mobile" alt="hero image for mobile">
      <img src="./images/image-hero-desktop.png" class="hero-desktop" alt="hero image for desktop">
    </article>
    <section class="main-section">
      <h1>
        Make remote work
      </h1>
      <p>
        Get your team in sync, no matter your location. Streamline processes, create team rituals, and watch productivity soar.
      </p>
      <button>Learn more</button>
      <div class="clients"></div>

    </section>
  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Vincent</a>.
  </footer>
  <script src="./script.js"></script>
</body>
</html>
